<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Academic homepage of Junting Wu.">
  <title>Junting Wu · Academic Homepage</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="./">Junting Wu</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="./" aria-current="page">About</a>
        <a href="publications/">Publications</a>
        <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden>
          <span aria-hidden="true" class="moon">☾</span>
          <span aria-hidden="true" class="sun">☀</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <section class="intro" aria-labelledby="name">
      <header class="intro-heading">
        <h1 id="name">Junting Wu</h1>
        <p class="subtitle">Academic homepage</p>
      </header>

      <div class="bio">
        <p>A short biography and research interests will appear here.</p>
      </div>

      <div class="profile-placeholder" aria-hidden="true">
        <span>JW</span>
      </div>
    </section>

    <section class="selected-publications" aria-labelledby="selected-publications-heading">
      <h2 id="selected-publications-heading">Selected Publications</h2>
      <p class="empty-state">Selected publications will appear here.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="https://github.com/Jonathanjtt">GitHub</a>
      <span>Design inspired by <a href="https://github.com/alshedivat/al-folio">al-folio</a></span>
    </div>
  </footer>
</body>
</html>
